name: Linux Notch

on:
  push:
    branches: [linux-notch, main]
    tags: ["v*"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and D-Bus stack
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 dbus dpkg-dev
      - name: Run unit tests
        run: dbus-run-session -- env PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Lint Python
        run: |
          python3 -m pip install 'ruff>=0.12'
          ruff check src tests plugins/examples
      - name: Check Python syntax
        run: python3 -m compileall -q src tests
      - name: Smoke test CLI without display access
        run: |
          PYTHONPATH=src python3 -m linux_notch --version
          PYTHONPATH=src python3 -m linux_notch.tools.notchctl --help
      - name: Build Debian package
        run: ./packaging/build-deb.sh
      - name: Inspect Debian package
        run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-notch-deb
          path: dist/*.deb
