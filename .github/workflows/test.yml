name: Linux Notch tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.12'
      - name: Lint
        run: ruff check src tests plugins/examples
      - name: Check Python syntax
        run: python -m compileall -q src tests

  unit-tests:
    name: Unit tests and CLI smoke checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and D-Bus test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 dbus
      - name: Run unit tests
        run: dbus-run-session -- env PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Smoke test CLI without display access
        run: |
          PYTHONPATH=src python3 -m linux_notch --version
          PYTHONPATH=src python3 -m linux_notch.tools.notchctl --help

  dco:
    name: Verify DCO sign-offs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check each pull request commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commits="$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")"
          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi
          while IFS= read -r commit; do
            if ! git show -s --format=%B "$commit" \
              | grep -Eq '^Signed-off-by: .+ <[^<>]+>$'; then
              echo "::error::Commit $commit is missing a DCO Signed-off-by trailer."
              exit 1
            fi
          done <<< "$commits"
