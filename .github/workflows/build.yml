name: Linux Notch build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
      - name: Build Debian package
        run: bash packaging/build-deb.sh
      - name: Verify package metadata and required notices
        run: |
          package="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          contents="$(dpkg-deb --contents "$package")"
          for notice in copyright NOTICE COPYRIGHT.md THIRD-PARTY-NOTICES.md \
            ASSET-ATTRIBUTION.md; do
            grep -Fq "/usr/share/doc/linux-notch/$notice" <<< "$contents"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-notch-deb
          path: dist/*.deb
          if-no-files-found: error
