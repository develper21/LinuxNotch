[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-notch"
version = "0.1.0"
description = "A native GTK island for Linux desktops"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Linux Notch contributors" }]
requires-python = ">=3.11"
dependencies = ["PyGObject>=3.46", "pycairo>=1.20"]

[project.optional-dependencies]
dev = ["ruff>=0.12"]

[project.urls]
Upstream = "https://github.com/MarcoZorn/lost-island"

[project.scripts]
linux-notch = "linux_notch.__main__:main"
notchctl = "linux_notch.tools.notchctl:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["linux_notch*"]

[tool.setuptools.package-data]
"linux_notch.ui" = ["*.css", "*.svg"]
"linux_notch.resources" = ["sounds/*.wav"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
